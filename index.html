<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0d0f14" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Underground — Eventos Megalomaníacos</title>
  <link rel="icon" type="image/png" href="assets/sprites/characters/manguinha_portrait.png" />
  <link rel="stylesheet" href="css/style.css?v=202611202025" />
</head>
<body>
  <canvas id="webgl-canvas"></canvas>
  <canvas id="game"></canvas>

  <!-- BARRA DE CONTROLE DOS EVENTOS MEGALOMANÍACOS -->
  <div id="event-tester-bar"
       onmousedown="event.stopPropagation()"
       onpointerdown="event.stopPropagation()"
       ontouchstart="event.stopPropagation()"
       style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; max-width: 96vw; background: rgba(13, 15, 20, 0.94); backdrop-filter: blur(8px); border: 1px solid rgba(186, 69, 255, 0.55); border-radius: 10px; padding: 6px 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.65), 0 0 15px rgba(186, 69, 255, 0.28); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <span style="color: #ba45ff; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">⚡ EVENTOS:</span>
    <button data-evt="noir" onclick="this.blur(); window.triggerMegaloEvent('noir')" style="cursor: pointer; background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.45); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">[1] 🎬 NOIR</button>
    <button data-evt="bloodmoon" onclick="this.blur(); window.triggerMegaloEvent('bloodmoon')" style="cursor: pointer; background: rgba(255,50,50,0.22); color: #ff6b6b; border: 1px solid rgba(255,50,50,0.45); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">[2] 🩸 SANGUE</button>
    <button data-evt="void_eclipse" onclick="this.blur(); window.triggerMegaloEvent('void_eclipse')" style="cursor: pointer; background: rgba(186,69,255,0.22); color: #da77f2; border: 1px solid rgba(186,69,255,0.45); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">[3] 🌌 VAZIO</button>
    <button data-evt="glacial" onclick="this.blur(); window.triggerMegaloEvent('glacial')" style="cursor: pointer; background: rgba(56,189,248,0.22); color: #7dd3fc; border: 1px solid rgba(56,189,248,0.45); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">[4] ❄️ GLACIAL</button>
    <button data-evt="solar" onclick="this.blur(); window.triggerMegaloEvent('solar')" style="cursor: pointer; background: rgba(245,158,11,0.22); color: #fcd34d; border: 1px solid rgba(245,158,11,0.45); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">[5] ☀️ SOLAR</button>
    <button data-evt="psychedelic" onclick="this.blur(); window.triggerMegaloEvent('psychedelic')" style="cursor: pointer; background: rgba(236,72,153,0.24); color: #f9a8d4; border: 1px solid rgba(236,72,153,0.5); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">[6] 🌀 SURREAL</button>
    <button onclick="this.blur(); window.triggerNextWave()" style="cursor: pointer; background: rgba(239,68,68,0.32); color: #fca5a5; border: 1px solid rgba(239,68,68,0.55); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">[K] 💀 PULAR</button>
    <button id="btn-event-audio" onclick="window.toggleEventAudioBtn(this)" style="cursor: pointer; background: rgba(250,204,21,0.18); color: #fde047; border: 1px solid rgba(250,204,21,0.65); border-radius: 6px; padding: 4px 9px; font-weight: bold; font-size: 11px;">🔇 ATIVAR SOM</button>
  </div>

  <!-- Modern AAA Menu Overlay -->
  <div id="menu-overlay" class="menu-overlay is-hidden" aria-label="Menu Principal">
    <header class="menu-topbar">
      <button id="btn-souls" class="glass-pill souls-btn" type="button" aria-label="Santuário das Almas">
        <span class="souls-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>
        </span>
        <div class="pill-text">
          <span class="pill-title">SANTUÁRIO <kbd>S</kbd></span>
          <span id="ui-souls-count" class="pill-sub">0 essências</span>
        </div>
      </button>

      <div class="title-block">
        <div class="title-ornament" aria-hidden="true"><span></span><i></i><span></span></div>
        <h1 class="game-title">UNDERGROUND</h1>
        <p class="game-subtitle">CRÔNICAS DA ARENA ANCESTRAL</p>
      </div>

      <div class="topbar-right">
        <button id="btn-chars" class="glass-pill chars-btn" type="button" aria-label="Escolher Campeão">
          <span class="chars-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </span>
          <div class="pill-text">
            <span class="pill-title">CAMPEÕES <kbd>TAB</kbd></span>
            <span class="pill-sub">Arquétipos 3D</span>
          </div>
        </button>

        <button id="btn-bestiary" class="glass-pill bestiary-btn" type="button" aria-label="Bestiário">
          <span class="book-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <path d="M9 7h7M9 11h5"/>
            </svg>
          </span>
          <div class="pill-text">
            <span class="pill-title">BESTIÁRIO <kbd>B</kbd></span>
            <span id="ui-bestiary-prog" class="pill-sub">0 / 27 descobertos</span>
          </div>
        </button>
      </div>
    </header>

    <section class="menu-dock" aria-label="Menu Principal">
      <button id="btn-play" class="btn-press-start" type="button" aria-label="Entrar na Arena">
        <div class="press-start-ornament" aria-hidden="true">
          <span></span><i>✦</i><span></span>
        </div>
        <span class="press-start-main">PRESSIONE PARA ENTRAR</span>
        <span class="press-start-sub">— ENTER OU ESPAÇO —</span>
      </button>

      <button id="btn-events" class="btn-press-start" type="button" aria-label="Modo Eventos Megalomaníacos" style="margin-top: 10px; border-color: #ba45ff; background: rgba(35, 10, 50, 0.85); box-shadow: 0 0 16px rgba(186, 69, 255, 0.4);">
        <span class="press-start-main" style="color: #e08aff; font-size: 11px;">⚡ TESTAR EVENTOS MEGALOMANÍACOS [E] ⚡</span>
        <span class="press-start-sub" style="color: #c9a0dc;">— 1 EVENTO ÉPICO POR HORDA (NOIR, SANGUE, VAZIO...) —</span>
      </button>

      <div id="ui-record-line" class="record-line">
        Recorde Ancestral: <strong id="ui-best-score">0</strong> pts <span class="rec-dot">•</span> <button id="ui-diff-desc" class="mode-tag" type="button" title="Clique para alternar dificuldade (Teclas 1, 2, 3)">Modo Pesadelo</button>
      </div>
    </section>

    <footer class="menu-footer">
      <span><kbd>WASD</kbd> Mover</span>
      <span><kbd>CLIQUE / ESPAÇO</kbd> Atacar</span>
      <span><kbd>SHIFT</kbd> Esquiva</span>
      <span><kbd>E / Q</kbd> Fúria</span>
      <span><kbd>P</kbd> Pausa</span>
    </footer>
  </div>

  <!-- WebGL GPU Engine (PixiJS) -->
  <script src="src/vendor/pixi.min.js"></script>

  <!-- Core Engine -->
  <script src="src/core/config.js?v=202611202025"></script>
  <script src="src/core/spatialGrid.js?v=202611202025"></script>
  <script src="src/core/assets.js?v=202611202025"></script>
  <script src="src/core/audio.js?v=202611202025"></script>
  <script src="src/core/input.js?v=202611202025"></script>

  <!-- Game Data & Definitions -->
  <script src="src/data/characters.js?v=202611202025"></script>
  <script src="src/data/monsters.js?v=202611202025"></script>
  <script src="src/data/items.js?v=202611202025"></script>

  <!-- World & Environment -->
  <script src="src/world/world.js?v=202611202025"></script>

  <!-- Gameplay Systems & AI -->
  <script src="src/systems/state.js?v=202611202025"></script>
  <script src="src/systems/combat.js?v=202611202025"></script>
  <script src="src/systems/ai.js?v=202611202025"></script>
  <script src="src/systems/update.js?v=202611202025"></script>

  <!-- Rendering & UI -->
  <script src="src/render/worldRenderer.js?v=202611202025"></script>
  <script src="src/render/pixiShaders.js?v=202611202025"></script>
  <script src="src/render/pixiRenderer.js?v=202611202025"></script>
  <script src="src/ui/hud.js?v=202611202025"></script>
  <script src="src/ui/menus.js?v=202611202025"></script>

  <!-- Main Loop Bootstrap -->
  <script src="src/main.js?v=202611202025"></script>
</body>
</html>
